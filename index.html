<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio ASIR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: single column app; home = plan by days + activity cards; game = question card + 2x2 tiles or typed blanks. Single dark stage look */
:root{--bg:#14122b;--panel:#211e45;--panel2:#2b2758;--fg:#f4f3ff;--muted:#a9a6d6;--red:#e21b3c;--blue:#1368ce;--yellow:#c79100;--green:#26890c;--ok:#2fbf71;--bad:#ff6b6f;--display:'Lexend',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,44px);font-weight:800}
h2{font-size:20px}h3{font-size:16px}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
button{font:inherit}
.days{display:grid;gap:10px}
.day{background:var(--panel);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.day input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--ok)}
.day .body{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);color:var(--fg);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:14px}
.chip:hover{background:var(--blue)}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{border:0;border-radius:10px;padding:14px;color:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.card b{font-family:var(--display);font-size:16px}
.card small{opacity:.9;font-size:13px}
.card .meta{margin-top:auto;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.k-mc{background:var(--blue)}.k-fill{background:#6a3fb5}.k-mix{background:var(--red)}.k-rev{background:var(--green)}
.opt{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.opt label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.pill{background:var(--panel);padding:6px 12px;border-radius:999px;font-size:14px;border:0;color:var(--fg)}
button.pill{cursor:pointer}
.q{background:var(--fg);color:var(--bg);border-radius:10px;padding:22px;font-family:var(--display);font-weight:600;font-size:clamp(17px,3vw,24px);text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center;line-height:1.45;flex-wrap:wrap}
.q input{font:inherit;font-weight:600;color:var(--bg);background:#e3e1ff;border:0;border-bottom:3px solid var(--blue);border-radius:6px 6px 0 0;padding:2px 8px;margin:2px 4px;width:12ch;max-width:100%;text-align:center}
.q input:focus{outline:2px solid var(--blue)}
.q input.okv{border-color:var(--green);background:#d4f5df}.q input.badv{border-color:var(--red);background:#ffd9dc}
.hint{font-size:14px;text-align:center}
.timer{height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--fg);width:100%;transition:width .2s linear}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.tile{border:0;border-radius:10px;color:#fff;font-weight:600;font-size:16px;padding:16px;min-height:72px;display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;transition:transform .1s,opacity .2s}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile svg{flex:none;width:28px;height:28px}
.tile:disabled{cursor:default}.tile.dim{opacity:.3}.tile.right{outline:4px solid var(--fg)}
.c0{background:var(--red)}.c1{background:var(--blue)}.c2{background:var(--yellow)}.c3{background:var(--green)}
.feedback{font-family:var(--display);font-size:20px;font-weight:800;text-align:center;min-height:28px}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.sol{text-align:center;color:var(--fg)}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:12px 26px;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer}
.btn.alt{background:var(--panel2);color:var(--fg)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.score{font-size:clamp(44px,12vw,88px);font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--panel);border-radius:8px;padding:12px 14px;line-height:1.5}
.review b{color:var(--ok)}.review s{color:var(--bad)}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.subj{border:0;border-radius:12px;padding:20px;color:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px}
.subj b{font-family:var(--display);font-size:22px}.subj small{opacity:.9}.subj .meta{margin-top:auto;font-size:13px;opacity:.9}
.subj.off{opacity:.55}
</style>
</head><body><div class="wrap" id="app"></div>
<script>
const SH=['<svg viewBox="0 0 30 30"><path d="M15 3 28 26H2z" fill="#fff"/></svg>','<svg viewBox="0 0 30 30"><path d="M15 2 28 15 15 28 2 15z" fill="#fff"/></svg>','<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#fff"/></svg>','<svg viewBox="0 0 30 30"><rect x="4" y="4" width="22" height="22" fill="#fff"/></svg>'];
const app=document.getElementById('app');
let S={},timerId=null,OPT={shufQ:true,shufA:true,time:30};
const LS={get(k,d){try{const v=localStorage.getItem('esa_'+SUBID+'_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('esa_'+SUBID+'_'+k,JSON.stringify(v))}catch(e){}}};
let BANK=null,PLAN=[],SUBID='x',MAN=null,FAILS={},BEST={},DONE={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>' '+s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?¿¡,]/g,' ').replace(/\bwon't\b/g,'will not').replace(/\bcan't\b|\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not').replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/'d\b/g,' would').replace(/\s+/g,' ').trim();
const item=id=>{const [k,i]=id.split('#');return {...BANK.sets[k].qs[+i],id,set:k}};
const ids=k=>BANK.sets[k].qs.map((_,i)=>k+'#'+i);
const nFails=()=>Object.keys(FAILS).length;
function setInfo(k){
 if(k==='rev')return {title:'Mis fallos',sub:'Solo lo que has fallado; sale cuando lo aciertas',cls:'k-rev',n:nFails()};
 if(k==='mix')return {title:'Examen mezclado',sub:'40 preguntas al azar de toda la asignatura',cls:'k-mix',n:40};
 const s=BANK.sets[k];return {title:s.title,sub:s.sub,cls:s.kind==='mc'?'k-mc':'k-fill',n:s.qs.length};}
function home(){clearInterval(timerId);
 const card=k=>{const s=setInfo(k);const b=BEST[k];return `<button class="card ${s.cls}" data-k="${k}"><b>${esc(s.title)}</b><small>${esc(s.sub)}</small><span class="meta">${s.n} preguntas${b!=null?' · mejor '+b+' %':''}${BANK.sets[k]?(BANK.sets[k].kind==='mc'?' · Kahoot':' · Rellenar'):''}</span></button>`};
 const groups=[...BANK.groups,["Repaso",["rev","mix"]]];
 if(!BANK.order.length){app.innerHTML=`<div class="bar"><a class="pill" href="#" style="text-decoration:none">← Asignaturas</a></div><h1>${esc(BANK.title)}</h1><p class="muted">Todavía no hay actividades. Pásale el temario a Claude para crearlas.</p>`;return}
 app.innerHTML=`<div class="bar"><a class="pill" href="#" style="text-decoration:none">← Asignaturas</a></div><h1>${esc(BANK.title)}</h1>
 <p class="muted">${esc(BANK.desc)}. Lo que falles se guarda en «Mis fallos» y vuelve a salir hasta que lo aciertes.</p>
 ${PLAN.length?'<h2>Plan de estudio</h2>':''}
 <div class="days">${PLAN.map((p,i)=>`<div class="day"><input type="checkbox" id="day${i}" ${DONE[i]?'checked':''} aria-label="Hecho"><div class="body"><h3>${p.d}</h3><p class="muted">${p.t}</p><div class="chips">${p.s.map(k=>`<button class="chip" data-k="${k}">${esc(setInfo(k).title)}${k==='rev'?' ('+nFails()+')':''}</button>`).join('')}</div></div></div>`).join('')}</div>
 <div class="opt muted">
  <label><input type="checkbox" id="optShufQ" ${OPT.shufQ?'checked':''}> Preguntas aleatorias</label>
  <label><input type="checkbox" id="optShufA" ${OPT.shufA?'checked':''}> Respuestas aleatorias</label>
  <label>Tiempo (Kahoot) <select id="optTime">${[20,30,60,0].map(v=>`<option value="${v}" ${OPT.time==v?'selected':''}>${v?v+' s':'Sin límite'}</option>`).join('')}</select></label>
 </div>
 ${groups.map(([g,ks])=>`<h2>${g}</h2><div class="cards">${ks.map(card).join('')}</div>`).join('')}
 <p class="muted" style="font-size:13px">El progreso se guarda en este navegador. <button class="chip" id="reset">Borrar progreso</button></p>`;
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>start(b.dataset.k));
 PLAN.forEach((_,i)=>document.getElementById('day'+i).onchange=e=>{DONE[i]=e.target.checked;LS.set('done',DONE)});
 const sv=()=>{OPT={shufQ:optShufQ.checked,shufA:optShufA.checked,time:+optTime.value};LS.set('opt',OPT)};
 ['optShufQ','optShufA','optTime'].forEach(id=>document.getElementById(id).onchange=sv);
 const r=document.getElementById('reset');r.onclick=()=>{if(r.dataset.c){FAILS={};BEST={};DONE={};LS.set('fails',FAILS);LS.set('best',BEST);LS.set('done',DONE);home()}else{r.dataset.c=1;r.textContent='Pulsa otra vez para confirmar'}};}
function start(k){
 let list;
 if(k==='rev'){list=Object.keys(FAILS);if(!list.length){app.querySelector('[data-k="rev"]').querySelector('small').textContent='No tienes fallos guardados ahora mismo';return}}
 else if(k==='mix')list=shuf(BANK.order.flatMap(ids)).slice(0,40);
 else list=ids(k);
 if(OPT.shufQ||k==='rev')list=shuf(list);
 S={k,qs:list.map(item),i:0,score:0,streak:0,ok:0,wrong:[]};show();window.scrollTo(0,0);}
function topBar(){return `<div class="bar"><button class="pill" id="quit">← Menú</button><span class="pill">${S.i+1} / ${S.qs.length}</span><span class="pill">Racha ${S.streak}</span><span class="pill">${S.score} pts</span></div>`}
function show(){const x=S.qs[S.i];clearInterval(timerId);
 if(x.t==='mc'){
  const order=OPT.shufA?shuf([0,1,2,3]):[0,1,2,3];
  app.innerHTML=topBar()+`<div class="q">${esc(x.q)}</div>${OPT.time?'<div class="timer"><i id="tb"></i></div>':''}
  <div class="grid">${order.map((o,p)=>`<button class="tile c${p}" data-o="${o}">${SH[p]}<span>${esc(x.o[o])}</span></button>`).join('')}</div>
  <div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="nx"></div>`;
  app.querySelectorAll('.tile').forEach(t=>t.onclick=()=>answerMC(+t.dataset.o));
  S.t0=Date.now();
  if(OPT.time)timerId=setInterval(()=>{const left=Math.max(0,OPT.time-(Date.now()-S.t0)/1000);document.getElementById('tb').style.width=(left/OPT.time*100)+'%';if(left<=0)answerMC(-1)},200);
 }else{
  const parts=esc(x.q).replace(/\{(\d)\}/g,(m,n)=>`<input id="in${n}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Hueco ${+n+1}" style="width:${Math.max(7,Math.max(...x.a[n].map(s=>s.length))+2)}ch">`);
  app.innerHTML=topBar()+`<div class="q"><span>${parts}</span></div>${x.h?`<p class="hint muted">Pista: ${esc(x.h)}</p>`:''}
  <div class="row"><button class="btn" id="chk">Comprobar</button></div>
  <div class="feedback" id="fb" aria-live="polite"></div><div class="sol" id="sol"></div><div class="row" id="nx"></div>`;
  const ins=[...app.querySelectorAll('.q input')];ins[0].focus();
  ins.forEach((el,j)=>el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(j<ins.length-1&&!ins[j+1].value)ins[j+1].focus();else answerFill()}});
  document.getElementById('chk').onclick=answerFill;S.t0=Date.now();}
 document.getElementById('quit').onclick=home;}
function mark(ok,x,given){
 const fb=document.getElementById('fb');
 if(ok){const pts=x.t==='mc'&&OPT.time?Math.round(1000*(1-(Date.now()-S.t0)/1000/OPT.time/2)):1000;S.streak++;S.ok++;const bonus=S.streak>2?100:0;S.score+=pts+bonus;fb.className='feedback ok';fb.textContent='¡Correcto! +'+pts+(bonus?' (+100 racha)':'');delete FAILS[x.id];}
 else{S.streak=0;S.wrong.push({x,given});fb.className='feedback bad';fb.textContent=given===null?'Se acabó el tiempo':'Incorrecto';FAILS[x.id]=1;}
 LS.set('fails',FAILS);
 const b=document.createElement('button');b.className='btn';b.textContent=S.i+1<S.qs.length?'Siguiente':'Ver resultados';
 b.onclick=()=>{S.i++;S.i<S.qs.length?show():end()};document.getElementById('nx').appendChild(b);
 setTimeout(()=>b.focus(),0);}
function answerMC(o){clearInterval(timerId);const x=S.qs[S.i];
 if(document.querySelector('.tile:disabled'))return;
 app.querySelectorAll('.tile').forEach(t=>{t.disabled=true;+t.dataset.o===x.c?t.classList.add('right'):t.classList.add('dim')});
 mark(o===x.c,x,o<0?null:x.o[o]);}
function answerFill(){const x=S.qs[S.i];const ins=[...app.querySelectorAll('.q input')];
 if(document.getElementById('chk').disabled)return;
 let all=true;const given=ins.map(i=>i.value.trim());
 ins.forEach((el,j)=>{const ok=x.a[j].some(a=>norm(a)===norm(el.value));if(!ok)all=false;el.classList.add(ok?'okv':'badv');el.readOnly=true});
 document.getElementById('chk').disabled=true;document.getElementById('chk').hidden=true;
 if(!all)document.getElementById('sol').innerHTML='Respuesta: <b>'+x.a.map(a=>esc(a.join(' / '))).join(' · ')+'</b>';
 mark(all,x,given.join(' · '));}
function solText(x){return x.t==='mc'?x.o[x.c]:x.a.map(a=>a.join(' / ')).join(' · ')}
function qText(x){return x.t==='mc'?x.q:x.q.replace(/\{\d\}/g,'____')}
function end(){const n=S.qs.length,pc=Math.round(S.ok/n*100);
 if(S.k!=='rev'){BEST[S.k]=Math.max(BEST[S.k]||0,pc);LS.set('best',BEST)}
 app.innerHTML=`<h2 class="muted">${esc(setInfo(S.k).title)}</h2><div class="score">${S.score} pts</div>
 <p>${S.ok} de ${n} correctas (${pc} %). Fallos pendientes en total: ${nFails()}.</p>
 <div class="row" style="justify-content:flex-start"><button class="btn" id="again">Volver al menú</button>${S.wrong.length?'<button class="btn alt" id="retry">Repetir las falladas ahora</button>':''}</div>
 ${S.wrong.length?'<h2>Falladas</h2><div class="review">'+S.wrong.map(w=>`<div>${esc(qText(w.x))}<br>${w.given?'<s>'+esc(w.given)+'</s><br>':''}<b>✔ ${esc(solText(w.x))}</b></div>`).join('')+'</div>':'<p>Sin fallos.</p>'}`;
 document.getElementById('again').onclick=home;
 const r=document.getElementById('retry');if(r)r.onclick=()=>{S={k:'rev',qs:shuf(S.wrong.map(w=>w.x)),i:0,score:0,streak:0,ok:0,wrong:[]};show()};window.scrollTo(0,0);}
async function getJSON(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u);return r.json()}
async function hub(){clearInterval(timerId);
 try{MAN=MAN||await getJSON('data/asignaturas.json')}catch(e){app.innerHTML='<h1>Estudio ASIR</h1><p class="muted">No se han podido cargar las asignaturas. Abre la app desde GitHub Pages (no como archivo suelto).</p>';return}
 const info=await Promise.all(MAN.asignaturas.map(a=>getJSON('data/'+a.id+'.json').then(d=>({a,n:Object.values(d.sets).reduce((t,s)=>t+s.qs.length,0),desc:d.desc})).catch(()=>({a,n:0,desc:'No disponible'}))));
 app.innerHTML=`<h1>${esc(MAN.title)}</h1><p class="muted">Elige asignatura. Cada una tiene su plan, sus Kahoots, ejercicios de rellenar y su repaso de fallos.</p>
 <div class="cards">${info.map(({a,n,desc})=>`<button class="subj ${n?'':'off'}" style="background:${a.color}" data-s="${a.id}"><b>${esc(a.title)}</b><small>${esc(desc)}</small><span class="meta">${n?n+' preguntas':'Sin contenido todavía'}</span></button>`).join('')}</div>`;
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.s});}
async function openSubject(id){
 try{BANK=await getJSON('data/'+id+'.json')}catch(e){location.hash='';return}
 SUBID=id;PLAN=BANK.plan||[];FAILS=LS.get('fails',{});BEST=LS.get('best',{});DONE=LS.get('done',{});OPT=LS.get('opt',OPT);document.title=BANK.title+' · Estudio ASIR';home();window.scrollTo(0,0);}
function route(){const id=location.hash.slice(1);if(id)openSubject(id);else{document.title='Estudio ASIR';hub()}}
window.addEventListener('hashchange',route);route();
</script></body></html>
